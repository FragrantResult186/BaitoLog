spring.application.name=BaitoLog
server.port=8080

# ===== DB（H2・ファイル保存）=====
# プロジェクト直下の data/ に保存される（data/ は .gitignore 済み。消すとDBが初期化される）
spring.datasource.url=jdbc:h2:file:./data/baitolog
spring.datasource.username=sa
spring.datasource.password=

# テーブルは Flyway（src/main/resources/db/migration の SQL）で作る。
# JPA にはテーブルを作らせず、Entity とテーブルが合っているかだけ確認させる。
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# 開発中は画面の変更をすぐ反映する
spring.thymeleaf.cache=false

# 個人用の設定（application-local.properties）があれば読み込む（コミットしない）
spring.config.import=optional:classpath:application-local.properties
